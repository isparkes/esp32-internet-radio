; PlatformIO Project Configuration File
;
; Internet Radio based on ESP32

[platformio]
description = Internet Radio and Clock based on ESP32
default_envs = internet-radio

[env:internet-radio]
platform = espressif32@7.1.3
; No exact board entry for this module (16MB flash / 8MB octal PSRAM) exists
; in this platform version, so the generic no-PSRAM N8 variant is used as a
; base (same MCU/USB ID) with flash/PSRAM settings overridden below to match.
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1  ; TEMP: route Serial over the native USB port for boot-log verification
build_unflags = -O2
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; MacOS (native USB - shows as usbmodem, not usbserial)
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

; Linux (native USB CDC-ACM)
; upload_port = /dev/ttyACM*
; monitor_port = /dev/ttyACM*

monitor_speed = 115200
lib_deps =
	paulstoffregen/Time@^1.6.1
	bblanchon/ArduinoJson@5.13.4
	esp32async/ESPAsyncWebServer@^3.6.1
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit BusIO@^1.13.2
	adafruit/Adafruit SH110X@^2.1.8
	earlephilhower/ESP8266Audio@2.2.0